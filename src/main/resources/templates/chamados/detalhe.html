<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${chamado.titulo} + ' · Central de Suporte'"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header('chamados')}"></header><main class="container"><div th:replace="~{fragments/layout :: mensagens}"></div><a class="back" th:href="@{/app/chamados}">← Voltar para chamados</a><section class="detail-head"><div><div class="detail-meta"><span class="mono" th:text="'CH-' + ${chamado.id}"></span><span class="badge" th:classappend="${chamado.prioridade.name().toLowerCase()}" th:text="${chamado.prioridade}"></span><span class="badge status" th:text="${#strings.replace(chamado.status, '_', ' ')}"></span></div><h1 th:text="${chamado.titulo}"></h1><p th:text="'Aberto em ' + ${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy \à\s HH:mm')}"></p></div></section>
<div class="detail-grid"><div class="stack"><section class="panel content-card"><span class="eyebrow">DESCRIÇÃO</span><p class="description" th:text="${chamado.descricao}"></p></section><section class="panel content-card"><div class="panel-title"><div><span class="eyebrow">HISTÓRICO</span><h2>Comentários</h2></div><span th:text="${#lists.size(chamado.comentarios)} + ' registros'"></span></div><div class="comments"><article class="comment" th:each="c : ${chamado.comentarios}"><div class="avatar" th:text="${#strings.substring(c.autor,0,1)}"></div><div><div><strong th:text="${c.autor}"></strong><small th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></small></div><p th:text="${c.texto}"></p></div></article><div class="empty" th:if="${#lists.isEmpty(chamado.comentarios)}"><span>Nenhum comentário até agora.</span></div></div><form class="comment-form" method="post" th:action="@{/app/chamados/{id}/comentarios(id=${chamado.id})}"><input name="autor" required maxlength="100" placeholder="Seu nome"><textarea name="texto" required maxlength="2000" rows="3" placeholder="Adicionar comentário..."></textarea><button class="button dark" type="submit">Comentar</button></form></section></div>
<aside class="stack"><section class="panel side-card"><h3>Detalhes</h3><dl><dt>Cliente</dt><dd th:text="${cliente.nome}"></dd><dt>Categoria</dt><dd th:text="${categoria.nome}"></dd><dt>Técnico responsável</dt><dd th:text="${tecnico == null ? 'Não atribuído' : tecnico.nome}"></dd></dl></section><section class="panel side-card" th:if="${chamado.status.name() != 'FECHADO'}"><h3>Gerenciar</h3><form method="post" th:action="@{/app/chamados/{id}/atribuir(id=${chamado.id})}"><label>Atribuir técnico<select name="tecnicoId" required><option value="">Selecione</option><option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nome}" th:selected="${t.id == chamado.tecnicoId}"></option></select></label><button class="button ghost full" type="submit">Salvar responsável</button></form><form method="post" th:action="@{/app/chamados/{id}/status(id=${chamado.id})}"><label>Alterar status<select name="status" required><option th:each="s : ${statusOpcoes}" th:value="${s}" th:text="${#strings.replace(s, '_', ' ')}" th:selected="${s == chamado.status}"></option></select></label><button class="button primary full" type="submit">Atualizar status</button></form></section></aside></div>
</main></body></html>
