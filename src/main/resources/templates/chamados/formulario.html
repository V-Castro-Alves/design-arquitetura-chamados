<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo chamado · Central de Suporte</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header('chamados')}"></header><main class="container narrow"><div th:replace="~{fragments/layout :: mensagens}"></div><a class="back" th:href="@{/app/chamados}">← Voltar para chamados</a><section class="page-heading"><div><span class="eyebrow">NOVA SOLICITAÇÃO</span><h1>Abrir chamado</h1><p>Descreva o problema com clareza para agilizar o atendimento.</p></div></section>
<form class="panel form-card" method="post" th:action="@{/app/chamados}"><div class="form-section"><span class="step">1</span><div><h2>Informações do chamado</h2><p>Conte o que aconteceu e qual o impacto.</p></div></div><label>Título <input name="titulo" required maxlength="150" placeholder="Ex.: Sistema não permite emitir nota fiscal"></label><label>Descrição <textarea name="descricao" required maxlength="2000" rows="7" placeholder="Inclua os passos realizados, mensagens exibidas e quando o problema começou."></textarea><small>Até 2.000 caracteres</small></label><div class="grid-2"><label>Prioridade<select name="prioridade" required><option value="">Selecione</option><option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"></option></select></label><label>Categoria<select name="categoriaId" required><option value="">Selecione</option><option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option></select></label><label>Cliente<select name="clienteId" required><option value="">Selecione</option><option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option></select></label><label>Técnico <select name="tecnicoId"><option value="">Atribuir depois</option><option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nome}"></option></select></label></div><div class="form-actions"><a class="button ghost" th:href="@{/app/chamados}">Cancelar</a><button class="button primary" type="submit">Abrir chamado</button></div></form>
</main></body></html>
