<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chamados · Central de Suporte</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments/layout :: header('chamados')}"></header><main class="container"><div th:replace="~{fragments/layout :: mensagens}"></div>
<section class="page-heading"><div><span class="eyebrow">ATENDIMENTO</span><h1>Chamados</h1><p>Consulte, filtre e acompanhe todas as solicitações.</p></div></section>
<form class="filters panel" method="get" th:action="@{/app/chamados}"><label>Status<select name="status"><option value="">Todos</option><option th:each="op : ${statusOpcoes}" th:value="${op}" th:text="${#strings.replace(op, '_', ' ')}" th:selected="${op == statusSelecionado}"></option></select></label><label>Prioridade<select name="prioridade"><option value="">Todas</option><option th:each="op : ${prioridades}" th:value="${op}" th:text="${op}" th:selected="${op == prioridadeSelecionada}"></option></select></label><label>Cliente<select name="clienteId"><option value="">Todos</option><option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}" th:selected="${c.id == clienteSelecionado}"></option></select></label><button class="button dark" type="submit">Filtrar</button><a class="button ghost" th:href="@{/app/chamados}">Limpar</a></form>
<section class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Código</th><th>Chamado</th><th>Prioridade</th><th>Status</th><th>Abertura</th><th></th></tr></thead><tbody><tr th:each="item : ${chamados.content}"><td class="mono" th:text="'CH-' + ${item.id}"></td><td><strong th:text="${item.titulo}"></strong><small th:text="${#strings.abbreviate(item.descricao, 70)}"></small></td><td><span class="badge" th:classappend="${item.prioridade.name().toLowerCase()}" th:text="${item.prioridade}"></span></td><td><span class="badge status" th:text="${#strings.replace(item.status, '_', ' ')}"></span></td><td th:text="${#temporals.format(item.dataAbertura, 'dd/MM/yyyy HH:mm')}"></td><td><a th:href="@{/app/chamados/{id}(id=${item.id})}">Abrir →</a></td></tr></tbody></table></div><div class="empty" th:if="${chamados.empty}"><strong>Nenhum resultado</strong><span>Ajuste os filtros ou abra um novo chamado.</span></div>
<div class="pagination" th:if="${chamados.totalPages > 1}"><a th:if="${chamados.hasPrevious()}" th:href="@{/app/chamados(page=${chamados.number - 1},status=${statusSelecionado},prioridade=${prioridadeSelecionada},clienteId=${clienteSelecionado})}">← Anterior</a><span th:text="'Página ' + ${chamados.number + 1} + ' de ' + ${chamados.totalPages}"></span><a th:if="${chamados.hasNext()}" th:href="@{/app/chamados(page=${chamados.number + 1},status=${statusSelecionado},prioridade=${prioridadeSelecionada},clienteId=${clienteSelecionado})}">Próxima →</a></div></section>
</main></body></html>
