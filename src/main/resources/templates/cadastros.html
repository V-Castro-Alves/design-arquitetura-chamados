<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastros · Central de Suporte</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/layout :: header('cadastros')}"></header><main class="container"><div th:replace="~{fragments/layout :: mensagens}"></div><section class="page-heading"><div><span class="eyebrow">CONFIGURAÇÃO</span><h1>Cadastros</h1><p>Gerencie as pessoas e classificações utilizadas nos chamados.</p></div></section><div class="tabs"><a href="#clientes">Clientes</a><a href="#tecnicos">Técnicos</a><a href="#categorias">Categorias</a></div>
<section class="registry" id="clientes"><div class="panel form-card"><h2>Novo cliente</h2><form method="post" th:action="@{/app/clientes}"><label>Nome<input name="nome" required maxlength="100"></label><label>E-mail<input name="email" type="email" required maxlength="120"></label><label>Telefone<input name="telefone" maxlength="20"></label><button class="button primary full" type="submit">Cadastrar cliente</button></form></div><div class="panel table-panel"><div class="panel-title"><h2>Clientes</h2><span th:text="${#lists.size(clientes)} + ' cadastrados'"></span></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th></tr></thead><tbody><tr th:each="c : ${clientes}"><td><strong th:text="${c.nome}"></strong></td><td th:text="${c.email}"></td><td th:text="${#strings.isEmpty(c.telefone) ? '—' : c.telefone}"></td></tr></tbody></table></div></div></section>
<section class="registry" id="tecnicos"><div class="panel form-card"><h2>Novo técnico</h2><form method="post" th:action="@{/app/tecnicos}"><label>Nome<input name="nome" required maxlength="100"></label><label>E-mail<input name="email" type="email" required maxlength="120"></label><label>Perfil<select name="perfil" required><option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option></select></label><button class="button primary full" type="submit">Cadastrar técnico</button></form></div><div class="panel table-panel"><div class="panel-title"><h2>Técnicos</h2><span th:text="${#lists.size(tecnicos)} + ' cadastrados'"></span></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr></thead><tbody><tr th:each="t : ${tecnicos}"><td><strong th:text="${t.nome}"></strong></td><td th:text="${t.email}"></td><td><span class="badge status" th:text="${t.perfil}"></span></td></tr></tbody></table></div></div></section>
<section class="registry" id="categorias"><div class="panel form-card"><h2>Nova categoria</h2><form method="post" th:action="@{/app/categorias}"><label>Nome<input name="nome" required maxlength="100"></label><label>Descrição<textarea name="descricao" maxlength="255" rows="4"></textarea></label><button class="button primary full" type="submit">Cadastrar categoria</button></form></div><div class="panel table-panel"><div class="panel-title"><h2>Categorias</h2><span th:text="${#lists.size(categorias)} + ' cadastradas'"></span></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Descrição</th></tr></thead><tbody><tr th:each="c : ${categorias}"><td><strong th:text="${c.nome}"></strong></td><td th:text="${#strings.isEmpty(c.descricao) ? '—' : c.descricao}"></td></tr></tbody></table></div></div></section>
</main></body></html>
